name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform target to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
          - bootstrap-dev
          - bootstrap-prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-plan:
    name: Terraform ${{ inputs.environment }} Plan
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve and validate Terraform target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET" in
            dev)
              tf_dir="./terraform/environments/dev"
              aws_role_arn="arn:aws:iam::304960797322:role/bravo-github-terraform-deploy"
              expected_account="304960797322"
              ;;
            bootstrap-dev)
              tf_dir="./terraform/bootstrap-dev"
              aws_role_arn="arn:aws:iam::304960797322:role/bravo-github-terraform-deploy"
              expected_account="304960797322"
              ;;
            prod)
              tf_dir="./terraform/environments/prod"
              aws_role_arn="arn:aws:iam::083268669572:role/bravo-prod-github-terraform-deploy"
              expected_account="083268669572"
              ;;
            bootstrap-prod)
              tf_dir="./terraform/bootstrap-prod"
              aws_role_arn="arn:aws:iam::083268669572:role/bravo-prod-github-terraform-deploy"
              expected_account="083268669572"
              ;;
            *) echo "Unsupported Terraform target: $TARGET" >&2; exit 1 ;;
          esac
          {
            echo "tf_dir=$tf_dir"
            echo "aws_role_arn=$aws_role_arn"
            echo "expected_account=$expected_account"
          } >> "$GITHUB_OUTPUT"

      - name: Show OIDC subject
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python3 -c "
          import base64, json
          p='$PAYLOAD'
          p += '=' * (-len(p) % 4)
          print(json.loads(base64.urlsafe_b64decode(p))['sub'])
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ steps.target.outputs.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          echo "Expected AWS account: ${{ steps.target.outputs.expected_account }}"
          echo "Authenticated AWS account: $actual_account"
          if [ "$actual_account" != "${{ steps.target.outputs.expected_account }}" ]; then
            echo "AWS account mismatch; refusing to access Terraform state or resources." >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Show Terraform Plan
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: terraform show -no-color tfplan

      - name: Add Terraform Plan to Summary
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: |
          echo "## Terraform ${{ inputs.environment }} Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the proposed ${{ inputs.environment }} infrastructure changes before deployment." >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ inputs.environment }}-plan-${{ github.run_id }}
          path: ${{ steps.target.outputs.tf_dir }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform ${{ inputs.environment }} Apply
    runs-on: ubuntu-latest
    needs: terraform-plan

    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve and validate Terraform target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET" in
            dev)
              tf_dir="./terraform/environments/dev"
              aws_role_arn="arn:aws:iam::304960797322:role/bravo-github-terraform-deploy"
              expected_account="304960797322"
              ;;
            bootstrap-dev)
              tf_dir="./terraform/bootstrap-dev"
              aws_role_arn="arn:aws:iam::304960797322:role/bravo-github-terraform-deploy"
              expected_account="304960797322"
              ;;
            prod)
              tf_dir="./terraform/environments/prod"
              aws_role_arn="arn:aws:iam::083268669572:role/bravo-prod-github-terraform-deploy"
              expected_account="083268669572"
              ;;
            bootstrap-prod)
              tf_dir="./terraform/bootstrap-prod"
              aws_role_arn="arn:aws:iam::083268669572:role/bravo-prod-github-terraform-deploy"
              expected_account="083268669572"
              ;;
            *) echo "Unsupported Terraform target: $TARGET" >&2; exit 1 ;;
          esac
          {
            echo "tf_dir=$tf_dir"
            echo "aws_role_arn=$aws_role_arn"
            echo "expected_account=$expected_account"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ steps.target.outputs.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          echo "Expected AWS account: ${{ steps.target.outputs.expected_account }}"
          echo "Authenticated AWS account: $actual_account"
          if [ "$actual_account" != "${{ steps.target.outputs.expected_account }}" ]; then
            echo "AWS account mismatch; refusing to access Terraform state or resources." >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-${{ inputs.environment }}-plan-${{ github.run_id }}
          path: ${{ steps.target.outputs.tf_dir }}

      - name: Terraform Apply
        working-directory: ${{ steps.target.outputs.tf_dir }}
        run: terraform apply -auto-approve -lock-timeout=5m tfplan

      - name: Add Apply Summary
        run: |
          echo "## Terraform ${{ inputs.environment }} Apply" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment successful." >> "$GITHUB_STEP_SUMMARY"