name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/environments/dev/**"
      - "terraform/modules/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:

  # DEVELOPMENT

  terraform-dev-plan:
    name: Terraform Development Plan
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'dev')
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-development
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::304960797322:role/bravo-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/environments/dev
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/environments/dev
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Show Terraform Plan
        working-directory: ./terraform/environments/dev
        run: terraform show -no-color tfplan

      - name: Add Terraform Plan to Summary
        working-directory: ./terraform/environments/dev
        run: |
          echo "## Terraform Development Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This plan contains the proposed development infrastructure changes." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-development-plan
          path: ./terraform/environments/dev/tfplan
          retention-days: 1


  terraform-dev-apply:
    name: Terraform Development Apply
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'dev')
    runs-on: ubuntu-latest
    needs: terraform-dev-plan

    concurrency:
      group: terraform-development
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::304960797322:role/bravo-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/environments/dev
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-development-plan
          path: ./terraform/environments/dev

      - name: Terraform Apply
        working-directory: ./terraform/environments/dev
        run: terraform apply -auto-approve -lock-timeout=5m tfplan

      - name: Add Apply Summary
        run: |
          echo "## Terraform Development Apply" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Terraform plan was successfully applied to development." >> "$GITHUB_STEP_SUMMARY"

  # PRODUCTION

  terraform-prod-plan:
    name: Terraform Production Plan
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production

    concurrency:
      group: terraform-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::304960797322:role/bravo-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/environments/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform/environments/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/environments/prod
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Show Terraform Plan
        working-directory: ./terraform/environments/prod
        run: terraform show -no-color tfplan

      - name: Add Terraform Plan to Summary
        working-directory: ./terraform/environments/prod
        run: |
          echo "## Terraform Production Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the proposed production infrastructure changes before deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan
          path: ./terraform/environments/prod/tfplan
          retention-days: 1


  terraform-prod-apply:
    name: Terraform Production Apply
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod'
    runs-on: ubuntu-latest
    needs: terraform-prod-plan

    # Configure the GitHub "production" environment
    # with required reviewers.
    environment: production

    concurrency:
      group: terraform-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::304960797322:role/bravo-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/environments/prod
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-production-plan
          path: ./terraform/environments/prod

      - name: Terraform Apply
        working-directory: ./terraform/environments/prod
        run: terraform apply -auto-approve -lock-timeout=5m tfplan

      - name: Add Apply Summary
        run: |
          echo "## Terraform Production Apply" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Terraform plan was successfully applied to production." >> "$GITHUB_STEP_SUMMARY"