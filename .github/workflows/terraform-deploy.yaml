name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-plan:
    name: Terraform ${{ inputs.environment }} Plan
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::304960797322:role/bravo-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: terraform init
      - name: Terraform Validate
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: terraform validate
      - name: Terraform Plan
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: terraform plan -out=tfplan -lock-timeout=5m
      - name: Show Terraform Plan
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: terraform show -no-color tfplan
      - name: Add Terraform Plan to Summary
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: |
          echo "## Terraform ${{ inputs.environment }} Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the proposed ${{ inputs.environment }} infrastructure changes before deployment." >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ inputs.environment }}-plan-${{ github.run_id }}
          path: ./terraform/environments/${{ inputs.environment }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform ${{ inputs.environment }} Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::304960797322:role/bravo-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: terraform init
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-${{ inputs.environment }}-plan-${{ github.run_id }}
          path: ./terraform/environments/${{ inputs.environment }}
      - name: Terraform Apply
        working-directory: ./terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
      - name: Add Apply Summary
        run: |
          echo "## Terraform ${{ inputs.environment }} Apply" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment successful." >> "$GITHUB_STEP_SUMMARY"
