name: Build, Scan and Push Images

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  build-scan-push:
    name: Build, Scan and Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - dashboard-api
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - scheduler
          - shipping-service
          - worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_number }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        uses: docker/setup-buildx-action@v5

      # Build image locally first - do NOT push yet
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Trivy
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@0.33.1
      #   with:
      #     image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
      #     format: table
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true
      #     exit-code: "1"

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}

      - name: Output image details
        run: |
          echo "Image pushed successfully"
          echo "Service: ${{ matrix.service }}"
          echo "Image tag: ${{ github.sha }}"
          echo "Image URI: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}"