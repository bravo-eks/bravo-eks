name: Build, Scan and Push Images

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/**"
      - ".github/workflows/build.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "AWS environment to publish images to"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: eu-west-2

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.set-services.outputs.services }}
      targets: ${{ steps.set-publish-targets.outputs.targets }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and map publishing target
        id: set-publish-targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.environment }}
        run: |
          case "$EVENT_NAME" in
            push)
              targets='[{"github_environment":"Development","expected_account":"304960797322","expected_registry":"304960797322.dkr.ecr.eu-west-2.amazonaws.com","expected_role":"arn:aws:iam::304960797322:role/bravo-github-ecr"}]'
              ;;
            workflow_dispatch)
              case "$TARGET" in
                dev)
                  targets='[{"github_environment":"Development","expected_account":"304960797322","expected_registry":"304960797322.dkr.ecr.eu-west-2.amazonaws.com","expected_role":"arn:aws:iam::304960797322:role/bravo-github-ecr"}]'
                  ;;
                prod)
                  targets='[{"github_environment":"Production","expected_account":"083268669572","expected_registry":"083268669572.dkr.ecr.eu-west-2.amazonaws.com","expected_role":"arn:aws:iam::083268669572:role/bravo-prod-github-ecr"}]'
                  ;;
                *) echo "Unsupported image publishing environment: $TARGET" >&2; exit 1 ;;
              esac
              ;;
            pull_request)
              targets='[]'
              ;;
            *)
              echo "Unsupported workflow event for image publishing: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Detect changed services
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'

            dashboard-api:
              - 'services/dashboard-api/**'

            inventory-service:
              - 'services/inventory-service/**'

            notification-service:
              - 'services/notification-service/**'

            order-service:
              - 'services/order-service/**'

            payment-service:
              - 'services/payment-service/**'

            scheduler:
              - 'services/scheduler/**'

            shipping-service:
              - 'services/shipping-service/**'

            worker:
              - 'services/worker/**'

      - name: Set service matrix
        id: set-services
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          CHANGED_SERVICES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git cat-file -e "${COMMIT_SHA}^{commit}" 2>/dev/null; then
              echo "Selected commit is unavailable in the checkout: $COMMIT_SHA" >&2
              exit 1
            fi
            if git rev-parse --verify "${COMMIT_SHA}^1" >/dev/null 2>&1; then
              base_commit="${COMMIT_SHA}^1"
            else
              base_commit="$(git hash-object -t tree /dev/null)"
            fi
            if ! changed_paths="$(git diff --name-only "$base_commit" "$COMMIT_SHA")"; then
              echo "Could not determine changed paths for selected commit $COMMIT_SHA." >&2
              exit 1
            fi
            services_json='['
            separator=''
            for service in api-gateway dashboard-api inventory-service notification-service order-service payment-service scheduler shipping-service worker; do
              if grep -q "^services/${service}/" <<< "$changed_paths"; then
                services_json+="${separator}\"${service}\""
                separator=','
              fi
            done
            printf 'services=%s]\n' "$services_json" >> "$GITHUB_OUTPUT"
          else
            echo "services=$CHANGED_SERVICES" >> "$GITHUB_OUTPUT"
          fi

  # PR: build and scan only
  build-scan-pr:
    name: PR Build and Scan - ${{ matrix.service }}
    needs: detect-changes

    if: >
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@0.33.1
      #   with:
      #     image-ref: ${{ matrix.service }}:${{ github.sha }}
      #     format: table
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true
      #     exit-code: "1"

  # Manual: build, scan and push only changed services to ECR
  build-scan-push-manual:
    name: Manual Build, Scan and Push - ${{ matrix.service }}
    needs: detect-changes

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.targets != '[]'

    runs-on: ubuntu-latest
    environment: ${{ matrix.target.github_environment }}

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
        target: ${{ fromJSON(needs.detect-changes.outputs.targets) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate selected AWS target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.environment }}
          GITHUB_ENVIRONMENT: ${{ matrix.target.github_environment }}
          EXPECTED_AWS_ACCOUNT: ${{ matrix.target.expected_account }}
          EXPECTED_ECR_REGISTRY: ${{ matrix.target.expected_registry }}
          EXPECTED_AWS_ROLE: ${{ matrix.target.expected_role }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          case "$GITHUB_ENVIRONMENT" in
            Development)
              expected_mapping="304960797322|304960797322.dkr.ecr.eu-west-2.amazonaws.com|arn:aws:iam::304960797322:role/bravo-github-ecr"
              if [ "$EVENT_NAME" != "push" ] && { [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_TARGET" != "dev" ]; }; then
                echo "Development publishing is not permitted for this event/selection." >&2
                exit 1
              fi
              ;;
            Production)
              expected_mapping="083268669572|083268669572.dkr.ecr.eu-west-2.amazonaws.com|arn:aws:iam::083268669572:role/bravo-prod-github-ecr"
              if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_TARGET" != "prod" ]; then
                echo "Production publishing requires an explicit manual prod selection." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported GitHub Environment: $GITHUB_ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          if [ "$EXPECTED_AWS_ACCOUNT|$EXPECTED_ECR_REGISTRY|$EXPECTED_AWS_ROLE" != "$expected_mapping" ]; then
            echo "AWS account, ECR registry, and IAM role do not match the selected environment." >&2
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ] || [ "$AWS_ROLE_ARN" != "$EXPECTED_AWS_ROLE" ]; then
            echo "AWS_ROLE_ARN is unset or does not match the selected environment." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_number }}

      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT: ${{ matrix.target.expected_account }}
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          echo "Expected AWS account: $EXPECTED_AWS_ACCOUNT"
          echo "Authenticated AWS account: $actual_account"
          if [ "$actual_account" != "$EXPECTED_AWS_ACCOUNT" ]; then
            echo "AWS account mismatch; refusing to access ECR." >&2
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR registry
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXPECTED_ECR_REGISTRY: ${{ matrix.target.expected_registry }}
        run: |
          echo "Expected ECR registry: $EXPECTED_ECR_REGISTRY"
          echo "Authenticated ECR registry: $ECR_REGISTRY"
          if [ "$ECR_REGISTRY" != "$EXPECTED_ECR_REGISTRY" ]; then
            echo "ECR registry does not match the selected AWS environment." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.33.1
      #   with:
      #     image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
      #     format: table
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true
      #     exit-code: "1"

      - name: Push image to ECR
        env:
          EXPECTED_AWS_ACCOUNT: ${{ matrix.target.expected_account }}
          EXPECTED_ECR_REGISTRY: ${{ matrix.target.expected_registry }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account" != "$EXPECTED_AWS_ACCOUNT" ]; then
            echo "AWS account mismatch before docker push; refusing to push." >&2
            exit 1
          fi
          if [ "$ECR_REGISTRY" != "$EXPECTED_ECR_REGISTRY" ]; then
            echo "ECR registry mismatch before docker push; refusing to push." >&2
            exit 1
          fi
          docker push \
            "$ECR_REGISTRY/${{ matrix.service }}:${{ github.sha }}"

      - name: Output image details
        run: |
          echo "Image pushed successfully"
          echo "Service: ${{ matrix.service }}"
          echo "Image tag: ${{ github.sha }}"
          echo "Image URI: ${{ matrix.target.expected_registry }}/${{ matrix.service }}:${{ github.sha }}"