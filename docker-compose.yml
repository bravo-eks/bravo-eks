services:
  postgres:
    image: postgres:16.9-alpine
    container_name: bravo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bravo
      POSTGRES_USER: bravo
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - bravo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bravo -d bravo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bravo-network

  redis:
    image: redis:7.2-alpine
    container_name: bravo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bravo-network

  localstack:
    image: localstack/localstack:3.8
    container_name: bravo-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bravo-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: bravo-order-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
      RUN_MIGRATIONS: "true"
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - bravo-network

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: bravo-inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: bravo-payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
      RUN_MIGRATIONS: "true"
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - bravo-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: bravo-notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network

  shipping-service:
    build:
      context: ./services/shipping-service
      dockerfile: Dockerfile
    container_name: bravo-shipping-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
      RUN_MIGRATIONS: "true"
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
      SQS_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - bravo-network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: bravo-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret
      AUTH_ENABLED: "false"
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085
      DASHBOARD_SERVICE_URL: http://dashboard-api:8086
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      shipping-service:
        condition: service_started
    networks:
      - bravo-network

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: bravo-worker
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      HEALTH_PORT: 8090

      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-events
      SQS_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085
    depends_on:
      localstack:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      shipping-service:
        condition: service_started
    networks:
      - bravo-network

  scheduler:
    build:
      context: ./services/scheduler
      dockerfile: Dockerfile
    container_name: bravo-scheduler
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      HEALTH_PORT: 8091
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - bravo-network

  dashboard-api:
    build:
      context: ./services/dashboard-api
      dockerfile: Dockerfile
    container_name: bravo-dashboard-api
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      DATABASE_URL: postgres://bravo:localdev@postgres:5432/bravo?sslmode=disable
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - bravo-network

  seed-test-data:
    image: postgres:16.9-alpine
    container_name: bravo-seed-test-data
    restart: "no"
    environment:
      PGPASSWORD: localdev
    command:
      - /bin/sh
      - -c
      - |
        until psql -h postgres -U bravo -d bravo -c "SELECT 1 FROM products LIMIT 1;" >/dev/null 2>&1; do
          echo "Waiting for inventory migrations..."
          sleep 2
        done

        psql -h postgres -U bravo -d bravo <<'SQL'
        INSERT INTO products (
          id,
          name,
          sku,
          price,
          stock,
          reserved
        )
        VALUES (
          'prod-001',
          'Test Product',
          'TEST-001',
          25.99,
          100,
          0
        )
        ON CONFLICT (id) DO UPDATE
        SET stock = GREATEST(products.stock, 100);
        SQL

        echo "Local test data ready."
    depends_on:
      inventory-service:
        condition: service_started
    networks:
      - bravo-network

volumes:
  bravo-postgres-data:

networks:
  bravo-network:
    driver: bridge