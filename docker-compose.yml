services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "${API_GATEWAY_PORT}:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bravo-network
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network
    restart: unless-stopped

  shipping-service:
    build:
      context: ./services/shipping-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${SHIPPING_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - bravo-network
    restart: unless-stopped

  dashboard-api:
    build:
      context: ./services/dashboard-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ORDER_SERVICE_URL: http://order-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      SHIPPING_SERVICE_URL: http://shipping-service:8080
    depends_on:
      - order-service
      - inventory-service
      - payment-service
      - shipping-service
    networks:
      - bravo-network
    restart: unless-stopped

  scheduler:
    build:
      context: ./services/scheduler
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bravo-network
    restart: unless-stopped


  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
    depends_on:
      - redis
    networks:
      - bravo-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bravo-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bravo-network
    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:


networks:
  bravo-network:
    driver: bridge