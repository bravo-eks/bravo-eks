apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: grafana
  namespace: monitoring

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bravo-gateway
      namespace: traefik

  hostnames:
    - grafana.bravoorders.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: monitoring-grafana
          port: 80
          weight: 1
