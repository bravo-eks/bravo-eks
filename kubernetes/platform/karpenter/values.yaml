settings:
  clusterName: bravo-dev

serviceAccount:
  create: true
  name: karpenter
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::304960797322:role/bravo-dev-karpenter-controller

replicas: 2

nodeSelector:
  kubernetes.io/os: linux
  workload: system

controller:
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi