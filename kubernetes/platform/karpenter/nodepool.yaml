apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: application

spec:
  template:
    metadata:
      labels:
        workload: application

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: application

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - t
            - m
            - c

        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values:
            - "3"

      expireAfter: 720h
      terminationGracePeriod: 5m

  limits:
    cpu: "20"
    memory: 40Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

    budgets:
      - nodes: "20%"