apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: application

spec:
  role: bravo-dev-node-role

  # Prefix delegation provides the pod IP capacity; keep kubelet below the
  # EKS recommended ceiling for instances with fewer than 30 vCPUs.
  kubelet:
    maxPods: 110

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        Name: "bravo-dev-private-*"

  securityGroupSelectorTerms:
    - name: "eks-cluster-sg-bravo-dev-*"

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  tags:
    Project: bravo-eks
    Environment: dev
    ManagedBy: Karpenter