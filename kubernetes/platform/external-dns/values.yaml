provider:
  name: aws

sources:
 - gateway-httproute

domainFilters:
  - "bravoorders.com"

zoneIdFilters:
  - "Z07233161ST1D7BZE342O"

registry: txt
txtOwnerId: "bravo-eks-prod"

policy: sync

serviceAccount:
  create: true
  name: external-dns
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::083268669572:role/bravo-eks-production-external-dns"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi