apiVersion: v1
kind: Service
metadata:
  name: {{ include "bravo-app.fullname" . }}
  labels:
    {{- include "bravo-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ .Values.service.portName }}
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "bravo-app.selectorLabels" . | nindent 4 }}