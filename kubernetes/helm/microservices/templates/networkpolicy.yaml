{{- if .Values.networkPolicy.enabled }}

{{- range $serviceName, $service := .Values.services }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $serviceName }}-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $serviceName }}
      app.kubernetes.io/instance: {{ $.Release.Name }}

  policyTypes:
    - Ingress
    - Egress

---

{{- end }}

{{- if .Values.networkPolicy.dns.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

---

{{- end }}

{{- range $serviceName, $service := .Values.services }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $serviceName }}-communication
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $serviceName }}
      app.kubernetes.io/instance: {{ $.Release.Name }}

  policyTypes:
    - Ingress
    - Egress

  ingress:

    {{- if $service.networkPolicy.ingressFrom }}

    {{- range $sourceService := $service.networkPolicy.ingressFrom }}

    {{- if eq $sourceService "api-gateway" }}

    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
              app.kubernetes.io/instance: {{ $.Release.Name }}

      ports:
        - protocol: TCP
          port: {{ $service.port }}

    {{- else }}

    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $sourceService }}
              app.kubernetes.io/instance: {{ $.Release.Name }}

      ports:
        - protocol: TCP
          port: {{ $service.port }}

    {{- end }}

    {{- end }}

    {{- end }}

  egress:

    {{- range $destinationService := $service.networkPolicy.egressTo }}

    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $destinationService }}
              app.kubernetes.io/instance: {{ $.Release.Name }}

      ports:
        - protocol: TCP
          port: {{ (index $.Values.services $destinationService).port }}

    {{- end }}


    {{- if $service.networkPolicy.allowPostgres }}

    - ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.postgres.port }}

    {{- end }}


    {{- if $service.networkPolicy.allowRedis }}

    - ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.redis.port }}

    {{- end }}

    {{- if $service.networkPolicy.allowExternalHTTPS }}

    - ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.externalHTTPS.port }}

    {{- end }}

---

{{- end }}

{{- end }}