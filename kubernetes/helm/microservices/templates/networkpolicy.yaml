{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bravo-app.fullname" . }}-default-deny
  labels:
    {{- include "bravo-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bravo-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
{{- if .Values.networkPolicy.dns.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bravo-app.fullname" . }}-allow-dns
  labels:
    {{- include "bravo-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bravo-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bravo-app.fullname" . }}-communication
  labels:
    {{- include "bravo-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bravo-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "bravo-app.name" $ }}
              app.kubernetes.io/instance: {{ .service }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.targetPort }}
    {{- end }}
  egress:
    {{- range .Values.networkPolicy.egressTo }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "bravo-app.name" $ }}
              app.kubernetes.io/instance: {{ .service }}
      {{- with .port }}
      ports:
        - protocol: TCP
          port: {{ . }}
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.allowPostgres }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.port }}
    {{- end }}
    {{- if .Values.networkPolicy.allowRedis }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.redis.port }}
    {{- end }}
    {{- if .Values.networkPolicy.allowExternalHTTPS }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.externalHTTPS.port }}
    {{- end }}
{{- end }}
