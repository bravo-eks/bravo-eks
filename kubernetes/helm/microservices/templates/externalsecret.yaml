{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bravo-app.fullname" . }}
  labels:
    {{- include "bravo-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}

  target:
    name: {{ .Values.externalSecret.target.name | default (include "bravo-app.fullname" .) }}
    creationPolicy: Owner

  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}