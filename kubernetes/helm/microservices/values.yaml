replicaCount: 1

strategy:
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

terminationGracePeriodSeconds: 30

serviceAccount:
  create: false
  name: ""

image:
  repository: ""
  tag: ""

  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  portName: http
  port: 80
  targetPort: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null
