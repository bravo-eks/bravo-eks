replicaCount: 1

strategy:
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

terminationGracePeriodSeconds: 30

serviceAccount:
  create: false
  name: ""


image:
  repository: ""
  tag: ""

  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  portName: http
  port: 80
  targetPort: 8080

httpRoute:
  enabled: false

  parentRefs:
    - name: bravo-gateway
      namespace: traefik

  hostnames: []

  path:
    type: PathPrefix
    value: /

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

services:

  api-gateway:
    replicaCount: 2
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    service:
      type: ClusterIP
      portName: http
      port: 80
      targetPort: 8080
    probes:
      path: /healthz
    env:
      - name: REDIS_URL
        valueFrom:
          secretKeyRef:
            name: bravo-secrets
            key: REDIS_URL

  order-service:
    replicaCount: 2
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    port: 8081
    service:
      type: ClusterIP
      portName: http
      port: 80
      targetPort: 8081
    probes:
      path: /healthz
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: bravo-secrets
            key: DATABASE_URL
      - name: SQS_QUEUE_URL
        valueFrom:
          secretKeyRef:
            name: bravo-secrets
            key: SQS_QUEUE_URL

  inventory-service:
    replicaCount: 2
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    port: 8082
    service:
      type: ClusterIP
      portName: http
      port: 80
      targetPort: 8082
    probes:
      path: /healthz
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: bravo-secrets
            key: DATABASE_URL

  payment-service:
