replicaCount: 1

strategy:
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

terminationGracePeriodSeconds: 30

serviceAccount:
  create: false
  name: ""

image:
  repository: ""
  tag: ""

  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  portName: http
  port: 80
  targetPort: 8080

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

externalSecret:
  enabled: false

  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ""

  data: []