replicaCount: 2

image:
  repository: "304960797322.dkr.ecr.eu-west-2.amazonaws.com/inventory-service"
  tag: "0c0ed2e7fb6adadef4a3bc1e4fe299dd9796127b"
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8082
    protocol: TCP

service:
  type: ClusterIP
  portName: http
  port: 80
  targetPort: 8082

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /healthz
    port: http

readinessProbe:
  httpGet:
    path: /healthz
    port: http

env: []

envFrom:
  - secretRef:
      name: inventory-service-database

configMap:
  enabled: false

migration:
  enabled: true

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: inventory-service-database
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: bravo/dev/inventory-service/database
        property: DATABASE_URL

autoscaling:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false

networkPolicy:
  enabled: true
  ingressFrom:
    - service: api-gateway
    - service: worker
  egressTo: []
  allowPostgres: true
  allowRedis: false
  allowExternalHTTPS: false