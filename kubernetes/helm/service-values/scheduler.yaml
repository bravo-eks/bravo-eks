replicaCount: 1

image:
  repository: "304960797322.dkr.ecr.eu-west-2.amazonaws.com/scheduler"
  tag: "2114c490647781ecacbfd0444ad4a4cebad6c321"
  pullPolicy: IfNotPresent

ports:
  - name: health
    containerPort: 8091
    protocol: TCP

service:
  type: ClusterIP
  portName: health
  port: 8091
  targetPort: 8091

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /healthz
    port: health

readinessProbe:
  httpGet:
    path: /healthz
    port: health

env: []

envFrom:
  - secretRef:
      name: scheduler-bravo-app

configMap:
  enabled: false

externalSecret:
  enabled: true
  target:
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgres://bravoadmin:{{ .dbPassword | urlquery }}@bravo-dev-postgres.c54ie6i6yszp.eu-west-2.rds.amazonaws.com:5432/bravodev?sslmode=require'
  data:
    - secretKey: dbPassword
      remoteRef:
        key: rds!db-3934bf46-bfb6-4352-983d-0260f319a9c4
        property: password

hpa:
  enabled: false

pdb:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo: []
  allowPostgres: true
  allowRedis: false
  allowExternalHTTPS: false