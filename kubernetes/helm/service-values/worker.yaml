replicaCount: 1

image:
  repository: "304960797322.dkr.ecr.eu-west-2.amazonaws.com/worker"
  tag: "4acd7586bdd57265bfad93267016222d2886f910"
  pullPolicy: IfNotPresent

ports:
  - name: health
    containerPort: 8090
    protocol: TCP

service:
  type: ClusterIP
  portName: health
  port: 8090
  targetPort: 8090

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /healthz
    port: health

readinessProbe:
  httpGet:
    path: /healthz
    port: health

env:
  - name: SQS_QUEUE_URL
    value: "https://sqs.eu-west-2.amazonaws.com/304960797322/bravo-dev-events"
  - name: AWS_REGION
    value: "eu-west-2"
  - name: ORDER_SERVICE_URL
    value: "http://order-service-bravo-app:80"
  - name: INVENTORY_SERVICE_URL
    value: "http://inventory-service-bravo-app:80"
  - name: PAYMENT_SERVICE_URL
    value: "http://payment-service-bravo-app:80"
  - name: NOTIFICATION_SERVICE_URL
    value: "http://notification-service-bravo-app:80"
  - name: SHIPPING_SERVICE_URL
    value: "http://shipping-service-bravo-app:80"

envFrom: []

configMap:
  enabled: false

serviceAccount:
  create: true
  name: worker
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::304960797322:role/bravo-dev-worker"

externalSecret:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo:
    - service: order-service
      port: 8081
    - service: inventory-service
      port: 8082
    - service: payment-service
      port: 8083
    - service: notification-service
      port: 8084
    - service: shipping-service
      port: 8085
  allowPostgres: false
  allowRedis: false
  allowExternalHTTPS: true