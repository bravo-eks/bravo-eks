replicaCount: 1

image:
  repository: "304960797322.dkr.ecr.eu-west-2.amazonaws.com/worker"
  tag: "2114c490647781ecacbfd0444ad4a4cebad6c321"
  pullPolicy: IfNotPresent

ports:
  - name: health
    containerPort: 8090
    protocol: TCP

service:
  type: ClusterIP
  portName: health
  port: 8090
  targetPort: 8090

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /healthz
    port: health

readinessProbe:
  httpGet:
    path: /healthz
    port: health

env:
  - name: SQS_QUEUE_URL
    value: "https://sqs.eu-west-2.amazonaws.com/304960797322/bravo-dev-events"
  - name: AWS_REGION
    value: "eu-west-2"

envFrom: []

configMap:
  enabled: false

serviceAccount:
  create: true
  name: worker
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::304960797322:role/bravo-dev-worker"

externalSecret:
  enabled: false

hpa:
  enabled: false

pdb:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo: []
  allowPostgres: false
  allowRedis: false
  allowExternalHTTPS: true