replicaCount: 2

image:
  repository: "304960797322.dkr.ecr.eu-west-2.amazonaws.com/api-gateway"
  tag: "2114c490647781ecacbfd0444ad4a4cebad6c321"
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8080
    protocol: TCP

service:
  type: ClusterIP
  portName: http
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 3

env: []

envFrom:
  - secretRef:
      name: api-gateway-bravo-app

configMap:
  enabled: false

externalSecret:
  enabled: true
  target:
    template:
      engineVersion: v2
      data:
        JWT_SECRET: '{{ .jwtSecret }}'
        REDIS_URL: 'redis://:{{ .redisPassword | urlquery }}@redis.redis.svc.cluster.local:6379/0'
  data:
    - secretKey: jwtSecret
      remoteRef:
        key: bravo-dev-runtime
        property: jwt_secret
    - secretKey: redisPassword
      remoteRef:
        key: bravo-dev-runtime
        property: redis_password

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

httpRoute:
  enabled: true
  parentRefs:
    - name: bravo-gateway
      namespace: traefik
  hostnames:
    - bravoorders.com
  path:
    type: PathPrefix
    value: /

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo: []
  allowPostgres: false
  allowRedis: true
  allowExternalHTTPS: false