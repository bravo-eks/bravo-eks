replicaCount: 1

image:
  repository: redis
  tag: "7.2-alpine"
  pullPolicy: IfNotPresent

service:
  port: 6379
  targetPort: 6379

auth:
  enabled: true
  existingSecret: redis-auth
  passwordKey: redis-password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: gp2

terminationGracePeriodSeconds: 30

podSecurityContext:
  fsGroup: 999

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
externalSecret:
  enabled: false
  refreshInterval: 1h
  remoteKey: ""
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
