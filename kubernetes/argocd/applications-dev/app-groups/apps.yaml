apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: bravo-apps
  namespace: argocd

spec:
  project: bravo-bootstrap

  source:
    repoURL: https://github.com/bravo-eks/bravo-eks.git
    targetRevision: main
    path: kubernetes/argocd/applications-dev/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true