apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-config-prod
  namespace: argocd
spec:
  project: bravo-prod-platform
  source:
    repoURL: https://github.com/bravo-eks/bravo-eks.git
    targetRevision: main
    path: kubernetes/platform/karpenter-prod
    directory:
      include: "{nodepool.yaml,ec2nodeclass.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
