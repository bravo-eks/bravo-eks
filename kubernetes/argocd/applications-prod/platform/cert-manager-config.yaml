apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: bravo-prod-platform

  source:
    repoURL: https://github.com/bravo-eks/bravo-eks.git
    targetRevision: main
    path: kubernetes/platform/cert-manager
    directory:
      include: "{clusterissuer.yaml,certificate.yaml}"

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    syncOptions: []
