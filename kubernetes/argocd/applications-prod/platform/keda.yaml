apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: bravo-prod-platform

  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.20.2
      helm:
        valueFiles:
          - $values/kubernetes/platform/prod/keda/values.yaml

    - repoURL: https://github.com/bravo-eks/bravo-eks.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
