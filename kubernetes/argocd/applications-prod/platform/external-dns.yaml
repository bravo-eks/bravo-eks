apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-dns
  namespace: argocd

spec:
  project: bravo-prod-platform

  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.22.0
      helm:
        valueFiles:
          - $values/kubernetes/platform/prod/external-dns/values.yaml

    - repoURL: https://github.com/bravo-eks/bravo-eks.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    syncOptions:
      - CreateNamespace=true