apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: worker
  namespace: argocd

spec:
  project: bravo-prod-apps

  source:
    repoURL: https://github.com/bravo-eks/bravo-eks.git
    targetRevision: main
    path: kubernetes/helm/microservices
    helm:
      valueFiles:
        - ../service-values-prod/worker.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: worker-bravo-app
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true