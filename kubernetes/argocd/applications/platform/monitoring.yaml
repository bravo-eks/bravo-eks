apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: bravo-platform

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.2
      helm:
        valueFiles:
          - $values/kubernetes/platform/monitoring/values.yaml

    - repoURL: https://github.com/bravo-eks/bravo-eks.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/bravo-eks/bravo-eks.git
      targetRevision: main
      path: kubernetes/platform/monitoring
      directory:
        exclude: values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
