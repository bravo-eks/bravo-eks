apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets
  namespace: argocd

spec:
  project: bravo-platform

  sources:
    # External Secrets Operator Helm chart
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.20.4
      helm:
        valueFiles:
          - $values/kubernetes/platform/external-secrets/values.yaml

    # Repository reference for Helm values
    - repoURL: https://github.com/bravo-eks/bravo-eks.git
      targetRevision: main
      ref: values

    # ClusterSecretStore manifest
    - repoURL: https://github.com/bravo-eks/bravo-eks.git
      targetRevision: main
      path: kubernetes/platform/external-secrets
      directory:
        include: "clustersecretstore.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true