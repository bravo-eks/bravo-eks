apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: inventory-service
  namespace: argocd

spec:
  project: bravo

  source:
    repoURL: https://github.com/bravo-eks/bravo-eks.git
    targetRevision: main
    path: kubernetes/helm/microservices
    helm:
      valueFiles:
        - ../service-values/inventory-service.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true