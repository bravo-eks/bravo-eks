apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: bravo-projects
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/bravo-eks/bravo-eks.git
    targetRevision: main
    path: kubernetes/argocd/projects

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
